services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rtx
      POSTGRES_PASSWORD: rtx
      POSTGRES_DB: rtx_estoque_importacao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtx -d rtx_estoque_importacao"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
